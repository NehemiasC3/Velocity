name: CI/CD Pipeline - Velocity ISP

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: Verificación y Compilación Backend
  # ==========================================
  backend-ci:
    name: 🛠️ Backend CI (TypeScript & Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: 📦 Instalar dependencias del Backend
        working-directory: ./backend
        run: npm ci

      - name: 🔍 Verificación estricta de tipos TypeScript
        working-directory: ./backend
        run: npm run typecheck

      - name: 🏗️ Compilar Backend
        working-directory: ./backend
        run: npm run build

  # ==========================================
  # JOB 2: Verificación y Compilación Frontend
  # ==========================================
  frontend-ci:
    name: 🎨 Frontend CI (React, Vite & Tailwind)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 📦 Instalar dependencias del Frontend
        working-directory: ./frontend
        run: npm ci

      - name: 🔍 Verificación estricta de tipos TypeScript
        working-directory: ./frontend
        run: npm run typecheck

      - name: 🏗️ Compilar Frontend (Production Bundle)
        working-directory: ./frontend
        run: npm run build

  # ==========================================
  # JOB 3: Validación de Build Docker
  # ==========================================
  docker-build:
    name: 🐳 Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐳 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Probar compilación de imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: velocity-server:test

  # ==========================================
  # JOB 4: Despliegue Continuo (CD) en Producción
  # ==========================================
  deploy:
    name: 🚀 Deploy to Production Server
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: 🔑 Conectar por SSH y Desplegar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: PROJECT_PATH
          script: |
            set -e
            echo "========================================================"
            echo "🚀 Iniciando Despliegue Automático de Velocity ISP..."
            echo "📅 Fecha: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "📂 Directorio destino: ${{ secrets.PROJECT_PATH }}"
            echo "========================================================"

            # 1. Navegar al directorio del proyecto en el servidor
            cd ${{ secrets.PROJECT_PATH }}

            # 2. Descargar los últimos cambios de la rama principal
            echo "📥 Descargando últimos cambios desde Git..."
            git fetch origin main
            git reset --hard origin/main

            # 3. Compilar frontend si aplica para assets estáticos
            if [ -d "frontend" ]; then
              echo "🎨 Compilando frontend..."
              (cd frontend && npm ci --prefer-offline && npm run build) || echo "Build frontend finalizado"
            fi

            # 4. Reconstruir y levantar contenedores en segundo plano
            echo "🐳 Reconstruyendo y reiniciando contenedores Docker..."
            docker compose down --remove-orphans || true
            docker compose up -d --build

            # 5. Limpiar imágenes antiguas sin tag para liberar espacio en disco
            echo "🧹 Limpiando imágenes y recursos Docker en desuso..."
            docker image prune -f

            echo "========================================================"
            echo "✅ Despliegue completado con éxito."
            echo "📊 Estado de los contenedores:"
            docker compose ps
            echo "========================================================"
