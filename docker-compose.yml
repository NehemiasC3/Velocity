services:
  # ==========================================
  # 🗄️ BASE DE DATOS POSTGRESQL (Prisma & Inventario)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: velocity-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-velocity_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-VelocitySecure2026!}
      POSTGRES_DB: ${POSTGRES_DB:-velocity_inventory}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-velocity_admin} -d ${POSTGRES_DB:-velocity_inventory}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - velocity-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # 🚀 VELOCITY BACKEND (TypeScript & Express / Mesa)
  # ==========================================
  velocity-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: velocity-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATA_DIR=/usr/src/app/data
      - PORT=3000
    volumes:
      - ./data:/usr/src/app/data
      - ./public:/usr/src/app/public
      - ./public:/public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - velocity-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # 📦 INVENTORY BACKEND API (Node.js + Prisma)
  # ==========================================
  inventory-backend:
    build:
      context: "./Inventario App/backend"
      dockerfile: Dockerfile
    container_name: velocity-inventory-api
    restart: always
    ports:
      - "${INVENTORY_API_PORT:-4000}:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-velocity_admin}:${POSTGRES_PASSWORD:-VelocitySecure2026!}@postgres:5432/${POSTGRES_DB:-velocity_inventory}?schema=public
      - JWT_SECRET=${JWT_SECRET:-velocity_secret_key_production_2026}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - velocity-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # 🎨 VELOCITY FRONTEND (React & Nginx + Reverse Proxy)
  # ==========================================
  velocity-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: velocity-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3080}:80"
    depends_on:
      - velocity-backend
      - inventory-backend
    volumes:
      - ./data/cache:/var/cache/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - velocity-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  velocity-net:
    driver: bridge
