# Redirección 301 Permanente desde el dominio antiguo hacia velocity.rappidobyatg.com
server {
    listen 80;
    server_name rappidobyatg.com www.rappidobyatg.com;
    return 301 http://velocity.rappidobyatg.com$request_uri;
}

# Servidor Principal de Producción Velocity
server {
    listen 80 default_server;
    server_name velocity.rappidobyatg.com localhost _;

    # Compresión Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cabeceras de Seguridad y Permitir Incrustación Iframe Same-Origin
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://velocity.rappidobyatg.com http://velocity.rappidobyatg.com https://*.rappidobyatg.com http://168.231.69.159 https://168.231.69.159;" always;

    # Proxy para API hacia el contenedor backend
    location /api/ {
        proxy_pass http://velocity-backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy para API de Inventario (Prisma Hub & Spoke)
    location /inventory-api/ {
        proxy_pass http://inventory-backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy para endpoint de salud
    location /health {
        proxy_pass http://velocity-backend:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Atajos de rutas limpias a nivel raíz (Pretty URLs sin .html)
    location = /supervisor {
        proxy_pass http://velocity-backend:3000/pages/supervisor.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /login {
        proxy_pass http://velocity-backend:3000/pages/login.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /technician {
        proxy_pass http://velocity-backend:3000/pages/technician.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /bodega {
        proxy_pass http://velocity-backend:3000/pages/bodega.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Soporte para Pretty URLs en /pages/ (ej. /pages/supervisor -> /pages/supervisor.html)
    location ~ ^/pages/([^.]+)$ {
        proxy_pass http://velocity-backend:3000/pages/$1.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy estándar para páginas y vistas estáticas
    location /pages/ {
        proxy_pass http://velocity-backend:3000/pages/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Proxy para assets y scripts del core (CSS, JS, iconos) con alta velocidad de caché
    location /src/ {
        proxy_pass http://velocity-backend:3000/src/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    }

    # Proxy para módulo de Inventario
    location /inventory/ {
        proxy_pass http://velocity-backend:3000/inventory/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1d;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=43200";
    }

    location /inventario/ {
        proxy_pass http://velocity-backend:3000/inventario/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1d;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=43200";
    }

    # Búsqueda Instantánea SPA React (opcional)
    location /search {
        alias /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Assets estáticos de Vite React (bundles js/css)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Ruta raíz: Renderiza directamente la Suite Velocity (Panel de Supervisor / Mesa de Órdenes)
    location / {
        proxy_pass http://velocity-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
