server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Proxy para API hacia el contenedor backend
    location /api/ {
        proxy_pass http://velocity-backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy para API de Inventario (Prisma Hub & Spoke)
    location /inventory-api/ {
        proxy_pass http://inventory-backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy para endpoint de salud
    location /health {
        proxy_pass http://velocity-backend:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy para páginas y vistas estáticas de Velocity (supervisor.html, technician.html, etc.)
    location /pages/ {
        proxy_pass http://velocity-backend:3000/pages/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para assets y scripts del core
    location /src/ {
        proxy_pass http://velocity-backend:3000/src/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy para módulo de Inventario
    location /inventory/ {
        proxy_pass http://velocity-backend:3000/inventory/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /inventario/ {
        proxy_pass http://velocity-backend:3000/inventario/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Soporte para React SPA (Single Page Application)
    location / {
        try_files $uri $uri/ @backend;
    }

    location @backend {
        proxy_pass http://velocity-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
