<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Velocity - Login</title>
    <link rel="icon" href="../logo-velocity.svg?v=2" type="image/svg+xml">
    <link rel="manifest" href="../manifest.json">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <meta name="google" content="notranslate">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "surface-container": "#e8eeff",
              "surface-container-low": "#f1f3ff",
              "outline": "#75777e",
              "surface-container-highest": "#d7e2ff",
              "surface-variant": "#d7e2ff",
              "surface-container-lowest": "#ffffff",
              "background": "#f9f9ff",
              "outline-variant": "#c5c6ce",
              "tertiary-fixed": "#83fc8e",
              "secondary-container": "#0070ea",
              "on-primary": "#ffffff",
              "surface-container-high": "#dfe8ff",
              "error": "#ba1a1a",
              "on-surface-variant": "#44474d",
              "surface": "#f9f9ff",
              "secondary": "#0059bb",
              "primary": "#031632",
              "on-surface": "#081b38"
            },
            "fontFamily": {
              "sans": ["Inter", "system-ui", "-apple-system", "sans-serif"]
            }
          }
        }
      }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; min-height: 100vh; overflow: hidden; zoom: 0.93; }
        .kinetic-gradient { background: linear-gradient(135deg, #0059bb 0%, #0070ea 100%); }
        .glass-panel { backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
        .floating-shape { animation: float 12s infinite ease-in-out alternate; }
        .floating-shape-2 { animation: float 15s infinite ease-in-out alternate-reverse; }
        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-40px) scale(1.05); }
        }
    </style>
</head>
<body class="bg-background text-on-surface relative">

    <!-- Decorative Background -->
    <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none flex justify-center items-center">
        <div class="absolute w-[60vw] h-[60vw] max-w-[800px] max-h-[800px] bg-secondary opacity-[0.04] rounded-full blur-3xl floating-shape top-[-10%] left-[-10%]"></div>
        <div class="absolute w-[50vw] h-[50vw] max-w-[600px] max-h-[600px] bg-tertiary-fixed opacity-[0.06] rounded-full blur-3xl floating-shape-2 bottom-[-10%] right-[-10%]"></div>
    </div>

    <!-- Login Container -->
    <div class="relative z-10 w-full min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-surface/60 border border-outline-variant/30 rounded-[2rem] p-8 md:p-10 shadow-[0_24px_48px_-12px_rgba(26,43,72,0.1)] glass-panel">
            
            <!-- System Header -->
            <div class="flex flex-col items-center mb-8 text-center">
                <div class="w-20 h-20 rounded-2xl flex items-center justify-center shadow-lg mb-4 transition-transform hover:scale-105 duration-300">
                    <img src="../logo-velocity.svg" alt="Velocity Logo" class="w-full h-full object-contain drop-shadow-md">
                </div>
                <h1 class="text-2xl font-black tracking-tight text-on-surface">Bienvenido a Velocity</h1>
                <p class="text-sm font-medium text-on-surface-variant mt-1.5">Plataforma Operativa de Rappido Panamá</p>
            </div>

            <!-- Login Mock Flow -->
            <div class="space-y-6">

                <!-- Divider removed - only email login -->

                <!-- Manual Form -->
                <form onsubmit="handleLogin(event);" class="space-y-4">
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase tracking-widest font-bold text-on-surface-variant ml-1">Correo Electrónico</label>
                        <input type="email" id="login-email" required autocomplete="username email" class="w-full bg-surface-container-lowest border border-outline-variant/50 focus:border-secondary focus:ring-1 focus:ring-secondary rounded-xl px-4 py-3 text-sm text-on-surface transition-colors" placeholder="tu@rappido.com">
                    </div>
                    <div class="space-y-1">
                        <div class="flex justify-between items-center ml-1">
                            <label class="text-[10px] uppercase tracking-widest font-bold text-on-surface-variant">Contraseña</label>
                        </div>
                        <div class="relative">
                            <input type="password" id="login-password" required autocomplete="current-password" class="w-full bg-surface-container-lowest border border-outline-variant/50 focus:border-secondary focus:ring-1 focus:ring-secondary rounded-xl px-4 py-3 text-sm text-on-surface transition-colors pr-12" placeholder="••••••••">
                            <button type="button" onclick="togglePassVis('login-password')" class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 flex items-center justify-center text-on-surface-variant/40 hover:text-secondary transition-colors group">
                                <span class="material-symbols-outlined text-[20px] transition-transform group-active:scale-90">visibility</span>
                            </button>
                        </div>
                    </div>

                    <!-- Recordar sesión -->
                    <div class="flex items-center gap-2 ml-1">
                        <input type="checkbox" id="remember-me" class="w-4 h-4 rounded border-outline-variant text-secondary focus:ring-secondary cursor-pointer">
                        <label for="remember-me" class="text-xs font-bold text-on-surface-variant cursor-pointer select-none">Recordar mis credenciales</label>
                    </div>
                    
                    <button type="submit" class="w-full kinetic-gradient py-3.5 mt-2 rounded-xl text-white font-bold text-sm tracking-wide shadow-md transition-transform active:scale-95 flex items-center justify-center gap-2">
                        Iniciar Sesión
                        <span class="material-symbols-outlined text-sm">arrow_forward</span>
                    </button>
                    
                    <p class="text-center text-xs text-on-surface-variant mt-4 opacity-80">
                        Solo personal autorizado de Rappido Panamá / Alliance Telecom Group S.A.
                    </p>
                </form>
            </div>
            
        </div>
    </div>

    <!-- Login Logic -->
    <script>
        // Cargar credenciales guardadas y sincronizar con el servidor al iniciar
        window.addEventListener('DOMContentLoaded', async () => {

            const saved = localStorage.getItem('V_Remember');
            if (saved) {
                try {
                    const { email, pass } = JSON.parse(saved);
                    document.getElementById('login-email').value    = email || '';
                    document.getElementById('login-password').value = pass  || '';
                    document.getElementById('remember-me').checked  = true;
                } catch {}
            }
        });

        function handleLogin(event) {
            event.preventDefault();
            const btn = event.submitter;
            const originalText = btn.innerHTML;
            btn.innerHTML = `<span class="material-symbols-outlined text-sm" style="animation: spin 1s linear infinite;">sync</span> Validando...`;
            btn.disabled = true;

            setTimeout(() => {
                const email    = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;
                const remember = document.getElementById('remember-me').checked;

                // Guardar o limpiar credenciales según el checkbox
                if (remember) {
                    localStorage.setItem('V_Remember', JSON.stringify({ email, pass: password }));
                } else {
                    localStorage.removeItem('V_Remember');
                }
                
                console.log('[Velocity] Intentando login remoto para:', email.toLowerCase());
                
                // Petición al servidor (NUEVO)
                fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        // Guardar información de sesión
                        sessionStorage.setItem('Velocity_Token', data.token);
                        sessionStorage.setItem('Velocity_Role', data.role);
                        sessionStorage.setItem('Velocity_Active_User', data.userId);
                        sessionStorage.setItem('Velocity_User_Name', data.name);
                        
                        // Redirigir según el rol devuelto por el servidor
                        window.location.href = data.role === 'supervisor' ? 'supervisor.html' : 'technician.html';
                    } else {
                        showLoginError(data.error || 'Error al iniciar sesión');
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                    }
                })
                .catch(err => {
                    console.error('Login Error:', err);
                    showLoginError('Error de conexión con el servidor.');
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                });
            }, 600);
        }

        function showLoginError(msg) {
            let el = document.getElementById('login-error');
            if (!el) {
                el = document.createElement('div');
                el.id = 'login-error';
                el.className = 'flex items-center gap-2 p-3 bg-error-container/30 border border-error/30 rounded-xl text-error text-sm font-bold';
                document.querySelector('form').prepend(el);
            }
            el.innerHTML = `<span class="material-symbols-outlined text-sm">error</span> ${msg}`;
            el.style.display = 'flex';
            setTimeout(() => { if (el) el.style.display = 'none'; }, 4000);
        }

        function togglePassVis(id) {
            const input = document.getElementById(id);
            if (!input) return;
            const isPass = input.type === 'password';
            input.type = isPass ? 'text' : 'password';
            const icon = input.parentElement.querySelector('.material-symbols-outlined');
            if (icon) icon.textContent = isPass ? 'visibility_off' : 'visibility';
        }
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../sw.js').then(reg => {
                    console.log('[Velocity PWA] Login SW registrado');
                }).catch(err => {
                    console.warn('[Velocity PWA] Error SW:', err);
                });
            });
        }
    </script>
</body>
</html>
